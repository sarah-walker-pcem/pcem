on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release, RelWithDebInfo]
        include:
          - os: ubuntu-latest
            platform: Ubuntu
            shell: bash
          - os: windows-latest
            platform: Windows
            shell: msys2 {0}

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }} 64bit ${{ matrix.build_type }} (GCC wxWidgets Build)

    defaults:
      run:
        shell: ${{ matrix.shell }}

    env:
      ARTIFACT_NAME: wxPCem-${{ matrix.build_type != 'Release' && format('{0}-', matrix.build_type) || '' }}vNext-${{ matrix.platform }}-GCC64-${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.1
        with:
          path: temp
          fetch-depth: 0

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          pacboy: >-
            ntldd-git:p
            toolchain:p
            SDL2:p
            openal:p
            wxwidgets3.2-msw:p
            cmake:p
            libslirp:p
            libpcap:p
            ninja:p
          install: >-
            base-devel
            zip
            unzip

      - name: Setup dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libopenal-dev libwxgtk3.2-dev libpcap-dev libslirp-dev cmake llvm clang ninja-build

      # Copy all the sources to the dist folder, before we start generating intermediate files.
      - name: Prepare package
        run: |
          mkdir -p dist/src artifacts
          cp -R ./temp/* dist/src
          rm -Rf ./dist/src/.git

      - name: Configure
        run: |
          EXTRA_ARGS=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA_ARGS="-DMSYS=TRUE -DCMAKE_INSTALL_PREFIX=$(pwd)/dist"
          fi
          cmake -S temp -B temp/build -G Ninja $EXTRA_ARGS \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPCEM_VERSION_STRING="vNext build ${GITHUB_SHA::8}"

      - name: Build
        run: ninja -C temp/build

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          ninja -C temp/build install
          ARCHIVE=$(pwd)/artifacts/$ARTIFACT_NAME-$GITHUB_SHA.zip
          cd dist
          ntldd -R "bin/pcem.exe" | sed -e 's/^[[:blank:]]*//g' | cut -d ' ' -f 3 | grep -E -i '(mingw|clang|ucrt)(32|64)' | sed -e 's|\\|/|g' | xargs -r cp --target-directory="bin"
          zip -r -9 "$ARCHIVE" *

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          DESTDIR=$(pwd)/dist ninja -C temp/build install
          ARCHIVE=$(pwd)/artifacts/$ARTIFACT_NAME-$GITHUB_SHA.tar.bz2
          cd dist
          tar -cjf "$ARCHIVE" *

      - name: Upload GitHub Actions artifacts
        uses: actions/upload-artifact@v4.3.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./artifacts

      - name: Upload to Wise Mirror Service
        uses: Dylan700/sftp-upload-action@latest
        with:
          server: fileserver.wisegs.com
          username: pcem
          password: ${{secrets.nte_cdn_s3_secret_access_key}}
          port: 22
          uploads: |
            ./artifacts => ./
